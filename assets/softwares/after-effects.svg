  <text x="50" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#ae-text)" text-anchor="middle" letter-spacing="-1.5" filter="url(#ae-glow)">Ae</text>
