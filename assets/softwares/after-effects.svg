      <stop offset="0%" stop-color="#1F0833"/>
      <stop offset="100%" stop-color="#0A0214"/>
    </linearGradient>
    <linearGradient id="ae-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D980FA"/>
