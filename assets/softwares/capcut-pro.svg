<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1926"/>
      <stop offset="100%" stop-color="#050B12"/>
    </linearGradient>
    <linearGradient id="cc-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="cc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#cc-bg)" stroke="#00F2FE" stroke-width="2.5"/>
  <g filter="url(#cc-glow)" transform="translate(18, 18) scale(0.64)">
    <!-- Top Ribbon / Trapezoid -->
    <path d="M 8 20 L 76 20 L 92 48 L 40 48 Z" fill="#FFFFFF"/>
    <!-- Bottom Ribbon / Trapezoid -->
    <path d="M 92 80 L 24 80 L 8 52 L 60 52 Z" fill="url(#cc-cyan)"/>
  </g>
</svg>