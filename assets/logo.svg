<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="KRISHNA X EDITZ Modern Studio Monogram">
  <defs>
    <!-- 24K Luxe Amber-Gold Gradients -->
    <linearGradient id="kxStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="kxArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <linearGradient id="kxLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Warm Studio Ambient Glow -->
    <filter id="kxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#kxGlow)">
    <!-- 1. Sleek Left Vertical Pillar (K Spine) -->
    <rect x="36" y="28" width="22" height="144" rx="11" fill="url(#kxStemGrad)" />

    <!-- 2. Lower Diagonal Leg (K to bottom-right X) with rounded capsule -->
    <path d="M 96 112 L 148 164 C 153.5 169.5, 162.5 169.5, 168 164 C 173.5 158.5, 173.5 149.5, 168 144 L 116 92 Z" 
          fill="url(#kxLegGrad)" />

    <!-- 3. Dynamic Upward Cutting Arrow (Viral Growth + Edit Cut + K/X Upper Wing) -->
    <!-- Pill body extending upwards-right -->
    <path d="M 72 126 L 136 62 C 139 59, 143 57, 147 57 L 158 57 L 158 68 C 158 72, 156 76, 153 79 L 89 143 C 83.5 148.5, 74.5 148.5, 69 143 C 63.5 137.5, 63.5 128.5, 69 123 Z" 
          fill="url(#kxArrowGrad)" />

    <!-- Precision Arrowhead matching Sorexa upward momentum -->
    <path d="M 140 28 L 176 34 L 170 70 L 158 58 L 130 86 L 118 74 L 146 46 Z" 
          fill="url(#kxArrowGrad)" />

    <!-- 4. Modern Diamond Precision Cut Accent at Center -->
    <circle cx="103" cy="103" r="3.5" fill="#FFFBEB" opacity="0.9" />
  </g>
</svg>
