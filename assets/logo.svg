<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none" role="img" aria-label="Krishna X Editz - The Mayur Cine Iris">
  <defs>
    <!-- 24K Amber Gold Primary Gradient -->
    <linearGradient id="mIrisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Peacock Feather Iridescent Emerald / Cyan Core -->
    <radialGradient id="peacockAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#06B6D4" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>

    <!-- Obsidian Lens Glass Fill -->
    <radialGradient id="lensGlass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#241B12" />
      <stop offset="60%" stop-color="#140F0A" />
      <stop offset="100%" stop-color="#0A0704" />
    </radialGradient>

    <!-- High-Glow Ambient Filter -->
    <filter id="mIrisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="120" cy="120" r="88" fill="url(#peacockAura)" />

  <!-- Outer Cine Lens Barrel Ring -->
  <circle cx="120" cy="120" r="96" stroke="url(#mIrisGold)" stroke-width="2.5" stroke-dasharray="14 4 4 4" opacity="0.65" />
  <circle cx="120" cy="120" r="88" stroke="url(#mIrisGold)" stroke-width="3" />
  <circle cx="120" cy="120" r="76" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5" />

  <!-- Lens Body Core -->
  <circle cx="120" cy="120" r="72" fill="url(#lensGlass)" />

  <!-- Mayur Feather Stylized Organic Crown (Top Arc) -->
  <path d="M 104 36 C 112 28, 128 28, 136 36 C 144 45, 140 56, 120 72 C 100 56, 96 45, 104 36 Z" fill="url(#mIrisGold)" opacity="0.9" />
  <circle cx="120" cy="46" r="3.5" fill="#38BDF8" filter="url(#mIrisGlow)" />

  <!-- Aperture Iris Blades (5 Angled Cine Shutter Leaves) -->
  <path d="M 120 48 L 156 72 L 140 100 Z" fill="url(#mIrisGold)" opacity="0.25" />
  <path d="M 156 72 L 168 116 L 132 124 Z" fill="url(#mIrisGold)" opacity="0.3" />
  <path d="M 168 116 L 144 160 L 116 136 Z" fill="url(#mIrisGold)" opacity="0.25" />
  <path d="M 144 160 L 96 160 L 104 128 Z" fill="url(#mIrisGold)" opacity="0.3" />
  <path d="M 96 160 L 72 116 L 108 116 Z" fill="url(#mIrisGold)" opacity="0.25" />
  <path d="M 72 116 L 84 72 L 120 96 Z" fill="url(#mIrisGold)" opacity="0.3" />

  <!-- Core Peacock Iris Teardrop (Krishna Emblem) -->
  <path d="M 120 78 C 142 78, 154 98, 154 120 C 154 142, 138 158, 120 158 C 102 158, 86 142, 86 120 C 86 98, 98 78, 120 78 Z" stroke="url(#mIrisGold)" stroke-width="2" fill="none" />
  <circle cx="120" cy="120" r="28" fill="url(#peacockAura)" />

  <!-- FOREGROUND: ICONIC CINEMATIC RAZOR 'X' -->
  <g filter="url(#mIrisGlow)">
    <!-- Arm 1: Top-Left to Bottom-Right Blade -->
    <polygon points="76,82 92,76 164,158 148,164" fill="url(#mIrisGold)" />
    <!-- Arm 2: Top-Right to Bottom-Left Blade -->
    <polygon points="164,82 148,76 76,158 92,164" fill="url(#mIrisGold)" />
    <!-- Center Precision Diamond Gem -->
    <polygon points="120,108 132,120 120,132 108,120" fill="#FFFFFF" opacity="0.95" />
    <circle cx="120" cy="120" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Horizontal Anamorphic Blue Flare Streak -->
  <line x1="36" y1="120" x2="204" y2="120" stroke="rgba(56, 189, 248, 0.7)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="84" y1="120" x2="156" y2="120" stroke="#FFF" stroke-width="2" stroke-linecap="round" filter="url(#mIrisGlow)" />

  <!-- 4 Cine Focus Crosshairs -->
  <line x1="120" y1="18" x2="120" y2="28" stroke="url(#mIrisGold)" stroke-width="2" />
  <line x1="120" y1="212" x2="120" y2="222" stroke="url(#mIrisGold)" stroke-width="2" />
  <line x1="18" y1="120" x2="28" y2="120" stroke="url(#mIrisGold)" stroke-width="2" />
  <line x1="212" y1="120" x2="222" y2="120" stroke="url(#mIrisGold)" stroke-width="2" />
</svg>