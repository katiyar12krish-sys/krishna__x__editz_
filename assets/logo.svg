<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" role="img" aria-label="KRISHNA X EDITZ Official Luxury Crest Logo">
  <defs>
    <!-- Ultra-Luxe Metallic Gold Gradient -->
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6" />
      <stop offset="25%" stop-color="#F4D9A0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA8222" />
      <stop offset="100%" stop-color="#F9E2AF" />
    </linearGradient>

    <!-- Deep Obsidian Backing -->
    <radialGradient id="crestBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B12" />
      <stop offset="60%" stop-color="#15100B" />
      <stop offset="100%" stop-color="#0B0907" />
    </radialGradient>

    <!-- Warm Amber Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C651E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF5D1" />
    </linearGradient>
  </defs>

  <!-- Outer Octagonal Luxury Crest Shield -->
  <polygon points="80,6 128,24 154,72 142,124 100,154 60,154 18,124 6,72 32,24" 
           fill="url(#crestBackdrop)" 
           stroke="url(#goldLuxe)" 
           stroke-width="2.5" 
           filter="drop-shadow(0 8px 24px rgba(0,0,0,0.85))" />

  <!-- Inner Fine Accent Ring -->
  <polygon points="80,14 122,30 144,72 134,118 97,144 63,144 26,118 16,72 38,30" 
           fill="none" 
           stroke="url(#goldLuxe)" 
           stroke-width="1" 
           stroke-dasharray="4 3" 
           opacity="0.65" />

  <!-- Cinematic Film Shutter Aperture Blades (4 Corner Precision Marks) -->
  <path d="M42 38 L54 38 L54 50" stroke="url(#goldLuxe)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M118 38 L106 38 L106 50" stroke="url(#goldLuxe)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M42 122 L54 122 L54 110" stroke="url(#goldLuxe)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M118 122 L106 122 L106 110" stroke="url(#goldLuxe)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- THE INTERLOCKING "K" & "X" CINEMATIC MONOGRAM -->
  <!-- Left Vertical Stem of "K" (Film Strip Column) -->
  <path d="M50 42 L62 42 L62 118 L50 118 Z" fill="url(#goldLuxe)" filter="url(#goldGlow)" />
  <!-- Film Perforations inside K Stem -->
  <rect x="54" y="52" width="4" height="6" rx="1.5" fill="#120D08" />
  <rect x="54" y="68" width="4" height="6" rx="1.5" fill="#120D08" />
  <rect x="54" y="84" width="4" height="6" rx="1.5" fill="#120D08" />
  <rect x="54" y="100" width="4" height="6" rx="1.5" fill="#120D08" />

  <!-- Diagonal Blade 1: Top of K / Main Blade of X -->
  <path d="M62 76 L98 44 L110 44 L76 78 Z" fill="url(#bladeGrad)" filter="url(#goldGlow)" />

  <!-- Diagonal Blade 2: Bottom of K / Lower Blade of X -->
  <path d="M68 74 L108 116 L96 116 L62 82 Z" fill="url(#bladeGrad)" filter="url(#goldGlow)" />

  <!-- Cross-Interlocking Blade completing the "X" -->
  <path d="M106 72 L78 102 L70 102 L96 72 Z" fill="url(#goldLuxe)" opacity="0.95" />

  <!-- Center Radiating Cinema Star / Sparkle Flare (✦) -->
  <g transform="translate(80, 80) scale(0.9)">
    <path d="M0 -15 Q0 0 15 0 Q0 0 0 15 Q0 0 -15 0 Q0 0 0 -15 Z" fill="#FFFFFF" filter="drop-shadow(0 0 8px #FFD700)" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFBE6" />
  </g>

  <!-- Bottom Brand Signature Tagline Curve Indicator -->
  <circle cx="80" cy="148" r="2.5" fill="url(#goldLuxe)" />
</svg>