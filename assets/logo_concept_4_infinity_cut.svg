<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none" role="img" aria-label="Krishna X Editz - Sovereign Infinity Cut">
  <defs>
    <linearGradient id="ribbonGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="ribbonShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19110B" />
      <stop offset="60%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <filter id="infinityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Dark Ambient Circle Base -->
  <circle cx="120" cy="120" r="92" fill="#130E09" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" />
  <circle cx="120" cy="120" r="82" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- CONTINUOUS 3D ISOMETRIC MÖBIUS INFINITY 'X' RIBBON -->
  <g filter="url(#infinityGlow)">
    <!-- Back Loop: Shadowed Depth Curve -->
    <path d="M 76 92 C 54 64, 42 108, 62 136 C 82 164, 118 140, 140 120 C 162 100, 198 76, 218 104 C 238 132, 226 176, 204 148 C 182 120, 146 144, 120 164 Z" fill="url(#ribbonShadow)" opacity="0.6" />

    <!-- Left Infinity Loop (Forms 'K' spine & loop) -->
    <path d="M 120 120 C 95 90, 60 70, 48 95 C 36 120, 52 155, 85 155 C 105 155, 120 135, 120 120 Z" fill="url(#ribbonGold1)" />
    <!-- Inner Cutout Hole Left -->
    <circle cx="72" cy="120" r="14" fill="#130E09" />

    <!-- Right Infinity Loop (Forms 'X' extension) -->
    <path d="M 120 120 C 145 150, 180 170, 192 145 C 204 120, 188 85, 155 85 C 135 85, 120 105, 120 120 Z" fill="url(#ribbonGold1)" />
    <!-- Inner Cutout Hole Right -->
    <circle cx="168" cy="120" r="14" fill="#130E09" />

    <!-- Center Intersecting Razor Blade (Precision Editing Cut) -->
    <polygon points="106,78 134,78 134,162 106,162" fill="url(#ribbonGold1)" opacity="0.9" />
    <line x1="120" y1="74" x2="120" y2="166" stroke="#FFFFFF" stroke-width="2" />

    <!-- Precision Starburst Highlight -->
    <polygon points="120,112 124,120 120,128 116,120" fill="#FFFFFF" />
  </g>
</svg>