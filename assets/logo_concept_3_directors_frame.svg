<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none" role="img" aria-label="Krishna X Editz - Director Cine Frame">
  <defs>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="neonStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <filter id="cineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cinema Viewport Background -->
  <rect x="22" y="34" width="196" height="172" rx="14" fill="#120E0A" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" />

  <!-- Precision Viewfinder Corner Brackets [   ] -->
  <!-- Top-Left Bracket -->
  <path d="M 36 62 L 36 46 L 58 46" stroke="url(#frameGold)" stroke-width="3" stroke-linecap="square" />
  <!-- Top-Right Bracket -->
  <path d="M 182 46 L 204 46 L 204 62" stroke="url(#frameGold)" stroke-width="3" stroke-linecap="square" />
  <!-- Bottom-Left Bracket -->
  <path d="M 36 178 L 36 194 L 58 194" stroke="url(#frameGold)" stroke-width="3" stroke-linecap="square" />
  <!-- Bottom-Right Bracket -->
  <path d="M 182 194 L 204 194 L 204 178" stroke="url(#frameGold)" stroke-width="3" stroke-linecap="square" />

  <!-- Viewfinder Optical Tick Marks & Aspect Ratio (2.39:1) -->
  <text x="120" y="48" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2" text-anchor="middle" opacity="0.85">2.39:1 • 4K RAW • 24FPS</text>
  <circle cx="48" cy="120" r="2" fill="#F59E0B" opacity="0.7" />
  <circle cx="192" cy="120" r="2" fill="#F59E0B" opacity="0.7" />

  <!-- CENTER ARCHITECTURAL 'X' SCULPTURE -->
  <g filter="url(#cineGlow)">
    <!-- Primary Blade: Diagonal Down -->
    <polygon points="74,72 96,62 166,168 144,178" fill="url(#frameGold)" />
    <!-- Secondary Blade: Diagonal Up -->
    <polygon points="144,62 166,72 96,178 74,168" fill="url(#frameGold)" />
    <!-- 3D Bevel Facet Highlight -->
    <polygon points="120,96 144,120 120,144 96,120" fill="#120E0A" stroke="url(#frameGold)" stroke-width="2" />
    <circle cx="120" cy="120" r="4" fill="#FFF" />
  </g>

  <!-- Horizontal Anamorphic Blue Flare Streak Traversal -->
  <rect x="22" y="118" width="196" height="4" fill="url(#neonStreak)" />
</svg>